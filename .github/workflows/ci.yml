name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check documentation
        run: node scripts/check-docs.mjs
      - name: Validate public deployment evidence
        run: node scripts/verify-deployment.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint with clippy
        run: cargo clippy --all-targets -- -A clippy::inconsistent_digit_grouping -A clippy::too_many_arguments -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Build contract WASM
        run: |
          for c in invoice_registry liquidity_pool factoring_escrow; do
            cargo rustc -p $c --crate-type cdylib --target wasm32v1-none --release
          done
          ls -la target/wasm32v1-none/release/*.wasm
      - name: Retain reviewable WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquivault-contract-wasm
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
          retention-days: 30
